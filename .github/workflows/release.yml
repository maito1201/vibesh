name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: vibesh
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: vibesh
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary: vibesh
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: vibesh.exe  # Cargo automatically appends .exe on Windows
            archive: zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Verify binary (Unix)
        if: matrix.platform.archive == 'tar.gz'
        run: |
          if [ ! -f "target/release/${{ matrix.platform.binary }}" ]; then
            echo "Error: Binary not found at target/release/${{ matrix.platform.binary }}"
            exit 1
          fi
          target/release/${{ matrix.platform.binary }} --version

      - name: Verify binary (Windows)
        if: matrix.platform.archive == 'zip'
        run: |
          if (-Not (Test-Path "target/release/${{ matrix.platform.binary }}")) {
            Write-Error "Binary not found at target/release/${{ matrix.platform.binary }}"
            exit 1
          }
          target/release/${{ matrix.platform.binary }} --version

      - name: Create archive (Unix)
        if: matrix.platform.archive == 'tar.gz'
        run: |
          set -e
          if [ ! -f "target/release/${{ matrix.platform.binary }}" ]; then
            echo "Error: Source binary not found for archiving"
            exit 1
          fi
          tar czf vibesh-${{ matrix.platform.target }}.tar.gz -C target/release ${{ matrix.platform.binary }}

      - name: Create archive (Windows)
        if: matrix.platform.archive == 'zip'
        run: |
          if (-Not (Test-Path "target/release/${{ matrix.platform.binary }}")) {
            Write-Error "Source binary not found for archiving"
            exit 1
          }
          Compress-Archive -Path target/release/${{ matrix.platform.binary }} -DestinationPath vibesh-${{ matrix.platform.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vibesh-${{ matrix.platform.target }}
          path: vibesh-${{ matrix.platform.target }}.${{ matrix.platform.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/vibesh-x86_64-unknown-linux-gnu/vibesh-x86_64-unknown-linux-gnu.tar.gz
            artifacts/vibesh-aarch64-apple-darwin/vibesh-aarch64-apple-darwin.tar.gz
            artifacts/vibesh-x86_64-apple-darwin/vibesh-x86_64-apple-darwin.tar.gz
            artifacts/vibesh-x86_64-pc-windows-msvc/vibesh-x86_64-pc-windows-msvc.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
